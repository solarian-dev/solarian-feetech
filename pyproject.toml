[project]
name = "solarian-feetech"
version = "0.1.0"
description = "Feetech servo actuator and bus plugin for Solarian robotics framework"
authors = [
    {name = "Solarian Contributors", email = "solarian@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "pyserial>=3.5",
    "deepdiff",
]

[project.optional-dependencies]
# Only the machine wired to the servos needs the vendor SDK: the driver imports
# scservo_sdk inside the methods that talk to the bus, so the module classes
# (and the robot schema built from them) import without it.
hardware = [
    "feetech-servo-sdk>=1.0.0",
]

[project.entry-points."solarian.actuators"]
feetech = "solarian_feetech.actuator:FeetechServo"

[project.entry-points."solarian.actuator_buses"]
feetech = "solarian_feetech.bus:FeetechBus"

[project.entry-points."solarian.commands"]
feetech-set-id = "solarian_feetech.commands.set_id:SetIdCommand"
feetech-inspect = "solarian_feetech.commands.inspect:InspectCommand"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
